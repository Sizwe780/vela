<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Observation record with four columns for focus, time and event, tentative interpretation and next evidence">
  <title>TPS2601 guided observation record</title>
  <rect width="720" height="360" fill="#0f1117"/>
  <text x="24" y="34" fill="#cbd2dc" font-size="18" font-family="sans-serif">Guided observation record</text>
  <g stroke="#69758a" stroke-width="2" fill="none">
    <rect x="24" y="55" width="672" height="48" rx="5"/><rect x="24" y="103" width="672" height="70" rx="5"/>
    <rect x="24" y="173" width="672" height="70" rx="5"/><rect x="24" y="243" width="672" height="70" rx="5"/>
  </g>
  <g fill="#69758a" font-size="12" font-family="sans-serif">
    <text x="36" y="84">08:13</text><text x="120" y="84">Observable event</text><text x="340" y="84">Tentative interpretation</text><text x="560" y="84">Next evidence</text>
  </g>
  <g fill="#cbd2dc" font-size="12" font-family="sans-serif">
    <text x="36" y="130">08:13</text>
    <text x="120" y="130">Respondent says “more pieces” means the larger piece.</text>
    <text x="340" y="130">Denominator may be treated as an absolute size.</text>
    <text x="560" y="130">Compare equal strips and collect a reason.</text>
    <text x="36" y="200">08:15</text>
    <text x="120" y="200">Two pairs use drawings at different scales.</text>
