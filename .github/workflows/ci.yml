name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run validate

      - name: Generate Prisma clients
        run: |
          npm run generate
          npx prisma generate --generator appClient

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build Next.js production bundle
        run: npm run build
        env:
          DATABASE_URL: postgresql://lms:lms@localhost:5432/lms?schema=public
          DATABASE_URL_UNPOOLED: postgresql://lms:lms@localhost:5432/lms?schema=public
          NEXT_PUBLIC_SITE_URL: http://localhost:3200
          POLICIES_APPROVED: "false"
          EMAIL_MODE: disabled
